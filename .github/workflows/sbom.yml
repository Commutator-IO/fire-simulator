name: sbom

# A weekly reminder: the SBOM of what is live, scanned again against current
# vulnerability data every Monday.
#
# A scan at build time only knows the advisories published before the build.
# The ones that concern a live site come out later, so deploy.yml keeps the
# inventory of each deployment and this workflow re-scans the last one, as it
# was stored — what is actually live, even if a later deployment failed. A
# failing run is the reminder: GitHub notifies the repository's watchers.
#
# Nothing here gates a push or a pull request; a manual run is available for
# checking on demand.
#
# The site is served as static files, so most of these packages only run during
# the build. When a finding cannot be reached in what is served, record it in
# .github/vex.openvex.json with its justification. Do not hide it with a scan
# setting: the VEX file keeps the decision, its reason and its date in one place.

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  # Needed to download the artifact kept by the last deploy.yml run.
  actions: read

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      # For the VEX file only. The inventory comes from the deployment.
      - uses: actions/checkout@v7

      # A successful run is one whose deploy job succeeded too. Pull request
      # runs are skipped: they build and test but never deploy.
      - name: Fetch the SBOM of the last deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml \
            --branch main --status success --limit 20 --json databaseId,event \
            --jq '[.[] | select(.event != "pull_request")][0].databaseId')
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::No successful deployment by deploy.yml was found."
            exit 1
          fi
          if ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
              --name sbom-production --dir production; then
            echo "::error::deploy.yml run $run_id kept no SBOM. It predates the inventory step, or its artifact is older than 90 days. Deploy again to produce one."
            exit 1
          fi
          echo "Scanning production at commit $(cat production/sbom.commit), deployed by run $run_id."

      - name: Scan against current vulnerability data
        uses: anchore/scan-action@v7
        with:
          sbom: production/sbom.cdx.json
          vex: .github/vex.openvex.json
          severity-cutoff: high
          fail-build: true
          output-format: table
