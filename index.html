<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Filet de sécurité pour l'hébergement statique : après un redéploiement,
      // une page encore en cache peut référencer un asset dont le nom a changé
      // (Vite renomme les bundles à chaque build), d'où une page blanche. On
      // détecte l'échec de chargement et on recharge une fois — un rechargement
      // revalide le HTML et récupère les bons noms.
      (function () {
        try {
          addEventListener(
            'error',
            function (e) {
              var el = e.target;
              var url = el && (el.src || el.href);
              if (url && /\/assets\//.test(url) && !sessionStorage.getItem('rechargeAsset')) {
                sessionStorage.setItem('rechargeAsset', '1');
                location.reload();
              }
            },
            true,
          );
          addEventListener('load', function () {
            sessionStorage.removeItem('rechargeAsset');
          });
        } catch (_) {}
      })();
    </script>
    <meta
      name="description"
      content="Boîte à outils patrimoniale : estimer son patrimoine à partir de ses placements réels, calculer combien de temps on peut en vivre sans toucher au capital — retrait, impôts, inflation, projection année par année — et en imprimer la synthèse. France et Japon, barèmes à jour."
    />
    <title>FIRE simulator — estimer son patrimoine, en vivre sans y toucher, et sa synthèse</title>
    <link rel="canonical" href="https://fire.commutator.io/" />

    <!-- Aperçu d'un lien partagé (Slack, LinkedIn, messageries). Ces robots
         lisent le HTML sans exécuter l'application : tout doit être écrit ici,
         en dur, avec des URL absolues. L'image se régénère avec `npm run og`. -->
