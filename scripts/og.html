<!doctype html>
<!--
  The card a shared link shows (Slack, LinkedIn, messaging apps).

  Drawn at exactly 1200 × 630, the size the platforms ask for, in the app's own
  palette and typeface, and rendered to public/og.png by `npm run og`. The curve
  is an illustration of the projection chart — a central path inside its
  pessimistic–optimistic band — not a simulation result: a card read out of
  context must not look like a promise.
-->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        font-family: Inter, system-ui, sans-serif;
        background: #f8f8fa;
        color: #191924;
        position: relative;
      }
      .bande {
        position: absolute;
        inset: 0 0 auto 0;
        height: 10px;
        background: #cb5f06;
      }
      .texte {
        position: absolute;
        left: 72px;
        top: 72px;
        width: 600px;
      }
      .marque {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .logo {
        width: 56px;
        height: 56px;
      }
      .nom {
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .nom span {
        color: #cb5f06;
      }
      h1 {
        margin-top: 52px;
        font-size: 50px;
        line-height: 1.12;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
      p {
        margin-top: 26px;
        font-size: 24px;
        line-height: 1.45;
        color: #6b6b80;
      }
      .pied {
        position: absolute;
        left: 72px;
        bottom: 56px;
        display: flex;
        gap: 12px;
        align-items: center;
        font-size: 22px;
        font-weight: 500;
        color: #404052;
      }
      .pastille {
        padding: 6px 14px;
        border-radius: 999px;
        background: #fff5ec;
        color: #a44a07;
        font-size: 18px;
      }
      .graphe {
        position: absolute;
        right: 56px;
        top: 96px;
        width: 440px;
        height: 440px;
        background: #fff;
        border: 1px solid #e2e2ea;
        border-radius: 28px;
      }
    </style>
  </head>
  <body>
    <div class="bande"></div>

    <div class="texte">
      <div class="marque">
        <svg class="logo" viewBox="0 0 64 64">
          <rect width="64" height="64" rx="16" fill="#cb5f06" />
          <path d="M21 16H43V24H29V28H39V36H29V48H21Z" fill="#fff" />
        </svg>
        <div class="nom">FIRE <span>simulator</span></div>
      </div>

      <h1>Ai-je assez pour vivre de mon patrimoine&nbsp;?</h1>
      <p>
        Retrait, impôts sur la plus-value, inflation, retraite future&nbsp;: la
        projection année par année, et sa synthèse imprimable.
      </p>
    </div>

    <div class="pied">
      fire.commutator.io
      <span class="pastille">France · Japon</span>
    </div>

    <svg class="graphe" viewBox="0 0 440 440">
      <!-- Gridlines, as on the projection chart. -->
      <g stroke="#f0f0f4" stroke-width="2">
        <line x1="44" y1="100" x2="404" y2="100" />
        <line x1="44" y1="180" x2="404" y2="180" />
        <line x1="44" y1="260" x2="404" y2="260" />
        <line x1="44" y1="340" x2="404" y2="340" />
      </g>
      <line x1="44" y1="380" x2="404" y2="380" stroke="#c4c4d1" stroke-width="2" />

      <!-- Pessimistic–optimistic band. -->
      <path
        d="M44 230 C 120 220, 200 200, 270 170 S 370 110, 404 80
           L 404 352 C 360 345, 300 320, 240 300 S 110 250, 44 230 Z"
        fill="#ffe6d0"
        opacity="0.8"
      />
      <path
        d="M44 230 C 120 220, 200 200, 270 170 S 370 110, 404 80"
        fill="none"
        stroke="#f9a75f"
        stroke-width="3"
        stroke-dasharray="7 7"
      />
      <path
        d="M44 230 C 110 250, 180 280, 240 300 S 360 345, 404 352"
        fill="none"
        stroke="#f9a75f"
        stroke-width="3"
        stroke-dasharray="7 7"
      />

      <!-- Central path. -->
      <path
        d="M44 230 C 120 236, 190 246, 250 250 S 360 236, 404 222"
        fill="none"
        stroke="#cb5f06"
        stroke-width="6"
        stroke-linecap="round"
      />

      <!-- The year a pension starts. -->
      <line x1="250" y1="60" x2="250" y2="380" stroke="#9494a6" stroke-width="2" stroke-dasharray="4 6" />
      <circle cx="250" cy="250" r="9" fill="#fff" stroke="#cb5f06" stroke-width="5" />
    </svg>
  </body>
</html>
